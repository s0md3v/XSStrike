[project]
name = "xsstrike"
version = "3.1.7"
description = "Advanced XSS Detection Suite"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fuzzywuzzy>=0.18.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "setuptools>=80.9.0",
    "tld>=0.13.1",
    "typer>=0.12.3",
    "pydantic>=2.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "black>=24.4.2",
    "playwright>=1.44.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true

[project.scripts]
xsstrike = "xsstrike:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
